<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Barber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 
  <header>
    <nav class="header__nav">
      <a href="#" class="header__logo-link">
        <img src="logo.png" alt="Logo Street Barber" class="header__logo">
      </a>

      <ul class="nav__links">
        <li><a href="#" class="nav__link">Home</a></li>
        <li><a href="#about" class="nav__link">Sobre Nós</a></li>
        <li><a href="#services" class="nav__link">Serviços</a></li>
        <li><a href="#contact" class="nav__link">Contato</a></li>
        <li><a href="#admin" class="nav__link">Admin</a></li>
      </ul>

      <a href="#agendar" class="btn-agendar">Agendar Corte</a>
    </nav>
  </header>

  
  <section class="hero">
    <div class="hero__content">
      <img src="Rectangle 34.png" alt="Grafite Street Barber" class="hero__grafite">

      <h2 class="hero__slogan">
        MUDAR SEU ESTILO É O PRIMEIRO PASSO PRA SUA AUTOESTIMA FICAR LÁ EM CIMA!
      </h2>

      <div class="horario-container">
        <div class="horario-texto">
          <h3 class="hero__sub-slogan">
            NA RUA É RAIZ, NO CORTE É ARTE!
          </h3>
          <p class="hero__horario">
            Horário de funcionamento: 08:00 às 20:00 - Seg a Sáb
          </p>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
